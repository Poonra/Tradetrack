[package]
name = "tradetrack"
version = "0.1.0"
edition = "2024"

[dependencies]
csv = "1.4.0"
rust_decimal = { version = "1.43.0", features = ["serde-str"] }
serde = { version = "1.0.229", features = ["derive"] }
thiserror = "2.0.21"
ureq = { version = "3.4.2", features = ["json"] }


[lints.clippy]
pedantic = { level = "warn", priority = -1 }
unwrap_used = "warn"
expect_used = "warn"
